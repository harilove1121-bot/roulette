<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>두근두근 룰렛</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-bg:    #f9d9e3;
    --pink-deep:  #f4a8c0;
    --pink-light: #fce8ef;
    --cream:      #fff8f0;
    --brown:      #8b5e52;
    --brown-soft: #c49a8a;
    --peach:      #ffb8a0;
    --mint:       #b8e8d8;
    --yellow:     #fff0a0;
    --white:      #ffffff;
    --text-dark:  #5a3a3a;
    --text-mid:   #9b6b6b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--pink-bg);
    background-image:
      linear-gradient(rgba(255,255,255,0.55) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.55) 1px, transparent 1px);
    background-size: 36px 36px;
    font-family: 'Jua', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    gap: 0;
  }

  /* ── 데코 이모지 (배경 고정) ── */
  .deco {
    position: fixed;
    font-size: clamp(22px, 3.5vw, 42px);
    pointer-events: none;
    z-index: 1;
    animation: floatDeco var(--fd) ease-in-out infinite;
    animation-delay: var(--fdelay);
  }
  @keyframes floatDeco {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50%     { transform: translateY(-10px) rotate(6deg); }
  }

  /* ── 카드 래퍼 ── */
  .card {
    position: relative;
    z-index: 10;
    background: var(--white);
    border-radius: 32px;
    border: 3px solid var(--pink-deep);
    padding: clamp(16px, 2.5vw, 28px) clamp(20px, 3vw, 36px);
    box-shadow:
      0 8px 0 var(--pink-deep),
      0 12px 32px rgba(244,168,192,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* ── 별 장식 줄 ── */
  .star-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: clamp(12px, 1.6vw, 18px);
    color: var(--brown-soft);
    letter-spacing: 1px;
  }
  .star-row span { font-size: 1.2em; }

  /* ── 룰렛 래퍼 ── */
  .wheel-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 외부 장식 링 */
  .outer-ring {
    position: absolute;
    border-radius: 50%;
    border: 5px dashed var(--pink-deep);
    animation: ringRotate 8s linear infinite;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes ringRotate { to { transform: rotate(360deg); } }

  canvas#wheel {
    border-radius: 50%;
    display: block;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 6px 18px rgba(244,168,192,0.6));
  }

  /* ── 포인터 ── */
  .pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    filter: drop-shadow(0 2px 4px rgba(139,94,82,0.4));
  }

  /* ── GO 버튼 ── */
  .center-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    width: clamp(64px, 10vw, 110px);
    height: clamp(64px, 10vw, 110px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, rgba(255,255,255,0.7) 0%, transparent 55%),
                linear-gradient(145deg, #ffb8c8, #f47fa0);
    color: #fff;
    font-family: 'Jua', sans-serif;
    font-size: clamp(14px, 2vw, 24px);
    border: 3px solid rgba(255,255,255,0.8);
    cursor: pointer;
    box-shadow:
      0 4px 0 #d4607a,
      0 6px 20px rgba(244,128,160,0.45);
    transition: transform 0.15s, box-shadow 0.12s;
    letter-spacing: 1px;
    text-shadow: 0 1px 3px rgba(180,60,90,0.4);
  }
  .center-btn:hover:not(:disabled) {
    transform: translate(-50%,-50%) scale(1.1) translateY(-2px);
    box-shadow: 0 6px 0 #d4607a, 0 10px 28px rgba(244,128,160,0.55);
  }
  .center-btn:active:not(:disabled) {
    transform: translate(-50%,-50%) scale(0.95) translateY(2px);
    box-shadow: 0 2px 0 #d4607a, 0 4px 12px rgba(244,128,160,0.4);
  }
  .center-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ── 결과 ── */
  #result {
    min-height: 52px;
    text-align: center;
    font-size: clamp(18px, 3vw, 36px);
    color: var(--brown);
    letter-spacing: 2px;
    text-shadow: 0 2px 0 rgba(244,168,192,0.5);
  }
  #result.show { animation: resBounce 0.45s cubic-bezier(0.34,1.56,0.64,1) both; }
  @keyframes resBounce {
    from { transform: scale(0.4); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  /* ── 폭죽 ── */
  #fireworks {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 50;
  }
</style>
</head>
<body>

<!-- 폭죽 -->
<canvas id="fireworks"></canvas>

<!-- 배경 데코 이모지 -->
<div class="deco" style="top:4%;  left:3%;  --fd:3.2s; --fdelay:0s">🧁</div>
<div class="deco" style="top:3%;  right:5%; --fd:2.8s; --fdelay:0.4s">🍓</div>
<div class="deco" style="top:40%; left:2%; --fd:3.8s; --fdelay:0.8s">🐻</div>
<div class="deco" style="top:42%; right:2%;--fd:3.1s; --fdelay:0.2s">🧸</div>
<div class="deco" style="bottom:6%;left:5%;--fd:2.9s; --fdelay:1.0s">☕</div>
<div class="deco" style="bottom:5%;right:4%;--fd:3.5s;--fdelay:0.6s">💌</div>
<div class="deco" style="top:18%; left:7%;--fd:4.0s; --fdelay:1.2s">⭐</div>
<div class="deco" style="top:20%; right:8%;--fd:3.3s;--fdelay:0.9s">🍒</div>
<div class="deco" style="bottom:20%;left:8%;--fd:3.6s;--fdelay:0.3s">💕</div>
<div class="deco" style="bottom:22%;right:7%;--fd:2.7s;--fdelay:1.4s">✨</div>

<!-- 카드 -->
<div class="card">
  <!-- 별 장식 줄 -->
  <div class="star-row">
    <span>⭐</span> 2학년 1반 친구들 중 과연 누가 될까? <span>⭐</span>
  </div>

  <!-- 룰렛 -->
  <div class="wheel-wrapper" id="wheelWrapper">
    <div class="outer-ring" id="outerRing"></div>
    <canvas id="wheel"></canvas>

    <!-- 포인터 하트 화살표 -->
    <svg class="pointer" width="40" height="50" viewBox="0 0 40 50">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffb8c8"/>
          <stop offset="100%" stop-color="#f4607a"/>
        </linearGradient>
      </defs>
      <polygon points="20,48 2,6 38,6" fill="url(#pg)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- 하트 -->
      <path d="M20,17 C20,17 14,12 14,17 C14,21 20,25 20,25 C20,25 26,21 26,17 C26,12 20,17 Z"
            fill="#fff" opacity="0.9"/>
    </svg>

    <button class="center-btn" id="spinBtn">돌리기</button>
  </div>

  <!-- 결과 -->
  <div id="result">🎀 버튼을 눌러보세요! 🎀</div>
</div>

<script>
/* ── 룰렛 데이터 ── */
const canvas = document.getElementById('wheel');
const ctx    = canvas.getContext('2d');
const items  = Array.from({length: 27}, (_, i) => `${i+1}번`);

/* 파스텔 핑크 계열 팔레트 */
const COLORS = [
  '#ffb8c8','#ffd6a5','#fdffb6','#caffbf',
  '#9bf6ff','#ffc6ff','#f4a8c0','#ffcba4',
  '#c8f7c5','#a8d8f0','#f7c5e0','#e0c8f7',
];

const NUM   = items.length;
const SLICE = (Math.PI * 2) / NUM;

/* 조각별 텍스트 색: 밝은 색엔 갈색, 진한 색엔 흰색 */
const TEXT_COLORS = [
  '#7a3a50','#7a5a30','#7a7a30','#307a50',
  '#30707a','#7a30aa','#7a3060','#7a4a20',
  '#307a28','#206070','#7a2860','#502878',
];

let rotAngle = 0;
let spinning = false;

function getR() {
  const vmin = Math.min(window.innerWidth, window.innerHeight);
  return Math.floor(vmin * 0.36);
}

function setupCanvas() {
  const r    = getR();
  const size = r * 2;
  canvas.width  = size;
  canvas.height = size;

  const wrapper = document.getElementById('wheelWrapper');
  wrapper.style.width  = size + 'px';
  wrapper.style.height = size + 'px';

  const pad  = 14;
  const ring = document.getElementById('outerRing');
  ring.style.width  = (size + pad*2) + 'px';
  ring.style.height = (size + pad*2) + 'px';
  ring.style.top    = (-pad) + 'px';
  ring.style.left   = (-pad) + 'px';
}

function drawWheel() {
  const r  = getR();
  const cx = r, cy = r;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* 바깥 테두리 원 */
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = '#fff0f5';
  ctx.fill();

  /* 전체 회전 */
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotAngle);
  ctx.translate(-cx, -cy);

  for (let i = 0; i < NUM; i++) {
    const startA = SLICE * i;
    const endA   = startA + SLICE;

    /* 조각 */
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r - 5, startA, endA);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();

    /* 조각 구분선 */
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth   = 2;
    ctx.stroke();

    /* 텍스트 */
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startA + SLICE / 2);
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle    = TEXT_COLORS[i % TEXT_COLORS.length];
    ctx.shadowColor  = 'rgba(255,255,255,0.8)';
    ctx.shadowBlur   = 3;
    const fSize = Math.max(9, Math.floor(r * 0.07));
    ctx.font = `bold ${fSize}px 'Jua', sans-serif`;
    ctx.fillText(items[i], r * 0.60, 0);
    ctx.restore();
  }

  ctx.restore();

  /* 중앙 원 – 귀여운 핑크 버튼 위에 덮는 흰 원 */
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.17, 0, Math.PI*2);
  ctx.fillStyle = '#fff0f5';
  ctx.shadowColor = 'rgba(244,168,192,0.5)';
  ctx.shadowBlur  = 12;
  ctx.fill();
  ctx.strokeStyle = '#f4a8c0';
  ctx.lineWidth   = 2.5;
  ctx.stroke();
  ctx.shadowBlur  = 0;

  /* 바깥 링 테두리 */
  ctx.beginPath();
  ctx.arc(cx, cy, r - 2, 0, Math.PI*2);
  ctx.strokeStyle = '#f4a8c0';
  ctx.lineWidth   = 4;
  ctx.stroke();
}

/* ── 회전 ── */
const spinBtn = document.getElementById('spinBtn');

function spin() {
  if (spinning) return;
  spinning = true;
  spinBtn.disabled    = true;
  spinBtn.textContent = '...';

  const resultEl = document.getElementById('result');
  resultEl.className   = '';
  resultEl.textContent = '';

  const totalRot   = Math.PI * 2 * (5 + Math.random() * 6);
  const duration   = 4200 + Math.random() * 1500;
  const startTime  = performance.now();
  const startAngle = rotAngle;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const t  = Math.min((now - startTime) / duration, 1);
    rotAngle = startAngle + totalRot * easeOut(t);
    drawWheel();
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      rotAngle            = startAngle + totalRot;
      drawWheel();
      spinning            = false;
      spinBtn.disabled    = false;
      spinBtn.textContent = '돌리기';
      showResult();
    }
  }
  requestAnimationFrame(animate);
}

function showResult() {
  const ptrAngle = ((-rotAngle - Math.PI / 2) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  const idx      = Math.floor(ptrAngle / SLICE) % NUM;

  const resultEl = document.getElementById('result');
  resultEl.textContent = `🎀 ${items[idx]} 당첨! 🎉`;
  void resultEl.offsetWidth;
  resultEl.className = 'show';

  launchFireworks();
}

/* ── 폭죽 (핑크·파스텔 컬러) ── */
const fwCanvas = document.getElementById('fireworks');
const fwCtx    = fwCanvas.getContext('2d');
let   particles = [];
let   fwRaf     = null;

function resizeFW() {
  fwCanvas.width  = window.innerWidth;
  fwCanvas.height = window.innerHeight;
}
resizeFW();

const FW_COLORS = ['#ffb8c8','#ffd6a5','#caffbf','#9bf6ff','#ffc6ff','#fff176','#f4a8c0'];

function launchFireworks() {
  for (let b = 0; b < 8; b++) {
    setTimeout(() => {
      const x   = fwCanvas.width  * (0.1 + Math.random() * 0.8);
      const y   = fwCanvas.height * (0.05 + Math.random() * 0.45);
      const col = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
      for (let i = 0; i < 55; i++) {
        const a  = (Math.PI*2 / 55) * i + Math.random() * 0.15;
        const sp = Math.random() * 5.5 + 1.5;
        particles.push({
          x, y,
          vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
          alpha: 1,
          color: col,
          r: Math.random()*3 + 1.5,
          shape: Math.random() < 0.3 ? 'star' : 'circle',
        });
      }
    }, b * 180);
  }
  if (!fwRaf) animFW();
}

function drawStar(ctx, x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a  = (Math.PI*2/5)*i - Math.PI/2;
    const ia = a + Math.PI/5;
    if (i===0) ctx.moveTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
    else        ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
    ctx.lineTo(x + Math.cos(ia)*r*0.45, y + Math.sin(ia)*r*0.45);
  }
  ctx.closePath();
}

function animFW() {
  fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
  particles = particles.filter(p => p.alpha > 0.02);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.alpha -= 0.013;
    fwCtx.save();
    fwCtx.globalAlpha  = p.alpha;
    fwCtx.fillStyle    = p.color;
    fwCtx.shadowColor  = p.color;
    fwCtx.shadowBlur   = 8;
    if (p.shape === 'star') {
      drawStar(fwCtx, p.x, p.y, p.r * 1.5);
      fwCtx.fill();
    } else {
      fwCtx.beginPath();
      fwCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      fwCtx.fill();
    }
    fwCtx.restore();
  }
  if (particles.length > 0) {
    fwRaf = requestAnimationFrame(animFW);
  } else {
    fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
    fwRaf = null;
  }
}

/* ── 초기 실행 ── */
setupCanvas();
drawWheel();
spinBtn.addEventListener('click', spin);
window.addEventListener('resize', () => { setupCanvas(); drawWheel(); resizeFW(); });
</script>
</body>
</html>
