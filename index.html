<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>두근두근 룰렛</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-bg:    #f9d9e3;
    --pink-deep:  #f4a8c0;
    --pink-light: #fce8ef;
    --cream:      #fff8f0;
    --brown:      #8b5e52;
    --brown-soft: #c49a8a;
    --peach:      #ffb8a0;
    --mint:       #b8e8d8;
    --yellow:     #fff0a0;
    --white:      #ffffff;
    --text-dark:  #5a3a3a;
    --text-mid:   #9b6b6b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--pink-bg);
    background-image:
      linear-gradient(rgba(255,255,255,0.55) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.55) 1px, transparent 1px);
    background-size: 36px 36px;
    font-family: 'Jua', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    gap: 0;
  }

  /* ── 데코 이모지 ── */
  .deco {
    position: fixed;
    font-size: clamp(22px, 3.5vw, 42px);
    pointer-events: none;
    z-index: 1;
    animation: floatDeco var(--fd) ease-in-out infinite;
    animation-delay: var(--fdelay);
  }
  @keyframes floatDeco {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50%     { transform: translateY(-10px) rotate(6deg); }
  }

  /* ── 카드 래퍼 ── */
  .card {
    position: relative;
    z-index: 10;
    background: var(--white);
    border-radius: 32px;
    border: 3px solid var(--pink-deep);
    padding: clamp(8px, 1.5vw, 16px) clamp(10px, 1.5vw, 20px);
    box-shadow:
      0 8px 0 var(--pink-deep),
      0 12px 32px rgba(244,168,192,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .star-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: clamp(12px, 1.6vw, 18px);
    color: var(--brown-soft);
    letter-spacing: 1px;
  }
  .star-row span { font-size: 1.2em; }

  .wheel-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .outer-ring {
    position: absolute;
    border-radius: 50%;
    border: 5px dashed var(--pink-deep);
    animation: ringRotate 8s linear infinite;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes ringRotate { to { transform: rotate(360deg); } }

  canvas#wheel {
    border-radius: 50%;
    display: block;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 6px 18px rgba(244,168,192,0.6));
  }

  .pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    filter: drop-shadow(0 2px 4px rgba(139,94,82,0.4));
  }

  .center-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    width: clamp(64px, 10vw, 110px);
    height: clamp(64px, 10vw, 110px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, rgba(255,255,255,0.7) 0%, transparent 55%),
                linear-gradient(145deg, #ffb8c8, #f47fa0);
    color: #fff;
    font-family: 'Jua', sans-serif;
    font-size: clamp(14px, 2vw, 24px);
    border: 3px solid rgba(255,255,255,0.8);
    cursor: pointer;
    box-shadow:
      0 4px 0 #d4607a,
      0 6px 20px rgba(244,128,160,0.45);
    transition: transform 0.15s, box-shadow 0.12s;
    letter-spacing: 1px;
    text-shadow: 0 1px 3px rgba(180,60,90,0.4);
  }
  .center-btn:hover:not(:disabled) {
    transform: translate(-50%,-50%) scale(1.1) translateY(-2px);
  }
  .center-btn:active:not(:disabled) {
    transform: translate(-50%,-50%) scale(0.95) translateY(2px);
  }
  .center-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ── 중앙 결과 오버레이 (새로 추가된 스타일) ── */
  #overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    display: none; /* 초기 상태 숨김 */
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .result-card {
    background: white;
    padding: 40px 60px;
    border-radius: 40px;
    border: 8px solid var(--pink-deep);
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    animation: popUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popUp {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .result-title {
    font-size: 28px;
    color: var(--text-mid);
    margin-bottom: 10px;
  }

  .result-number {
    font-size: 80px;
    color: var(--brown);
    margin-bottom: 20px;
    display: block;
    text-shadow: 4px 4px 0px var(--pink-bg);
  }

  .close-btn {
    padding: 12px 30px;
    font-size: 20px;
    font-family: 'Jua', sans-serif;
    background: var(--pink-deep);
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 #d4607a;
  }
  .close-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #d4607a; }

  #result-hint {
    min-height: 40px;
    color: var(--brown-soft);
    font-size: 20px;
  }

  #fireworks {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 150; /* 오버레이보다 위 */
  }
</style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div class="deco" style="top:4%;  left:3%;  --fd:3.2s; --fdelay:0s">🧁</div>
<div class="deco" style="top:3%;  right:5%; --fd:2.8s; --fdelay:0.4s">🍓</div>
<div class="deco" style="top:40%; left:2%; --fd:3.8s; --fdelay:0.8s">🐻</div>
<div class="deco" style="top:42%; right:2%;--fd:3.1s; --fdelay:0.2s">🧸</div>
<div class="deco" style="bottom:6%;left:5%;--fd:2.9s; --fdelay:1.0s">☕</div>
<div class="deco" style="bottom:5%;right:4%;--fd:3.5s;--fdelay:0.6s">💌</div>

<div class="card">
  <div class="star-row">
    <span>⭐</span> 2학년 1반 친구들 중 과연 누가될까? <span>⭐</span>
  </div>

  <div class="wheel-wrapper" id="wheelWrapper">
    <div class="outer-ring" id="outerRing"></div>
    <canvas id="wheel"></canvas>
    <svg class="pointer" width="40" height="50" viewBox="0 0 40 50">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffb8c8"/>
          <stop offset="100%" stop-color="#f4607a"/>
        </linearGradient>
      </defs>
      <polygon points="20,48 2,6 38,6" fill="url(#pg)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M20,17 C20,17 14,12 14,17 C14,21 20,25 20,25 C20,25 26,21 26,17 C26,12 20,17 Z" fill="#fff" opacity="0.9"/>
    </svg>
    <button class="center-btn" id="spinBtn">돌리기</button>
  </div>

  <div id="result-hint">🎀 버튼을 눌러보세요! 🎀</div>
</div>

<div id="overlay">
  <div class="result-card">
    <div class="result-title">🎉 축하합니다! 🎉</div>
    <div class="result-number" id="targetNum">0번</div>
    <button class="close-btn" onclick="closeResult()">다시 돌리기</button>
  </div>
</div>

<script>
const canvas = document.getElementById('wheel');
const ctx    = canvas.getContext('2d');
const items  = Array.from({length: 27}, (_, i) => `${i+1}번`);

const COLORS = [
  '#ffb8c8','#ffd6a5','#fdffb6','#caffbf',
  '#9bf6ff','#ffc6ff','#f4a8c0','#ffcba4',
  '#c8f7c5','#a8d8f0','#f7c5e0','#e0c8f7',
];

const NUM   = items.length;
const SLICE = (Math.PI * 2) / NUM;

const TEXT_COLORS = [
  '#7a3a50','#7a5a30','#7a7a30','#307a50',
  '#30707a','#7a30aa','#7a3060','#7a4a20',
  '#307a28','#206070','#7a2860','#502878',
];

let rotAngle = 0;
let spinning = false;

function getR() {
  const vmin = Math.min(window.innerWidth, window.innerHeight);
  return Math.floor(vmin * 0.46);
}

function setupCanvas() {
  const r    = getR();
  const size = r * 2;
  canvas.width  = size;
  canvas.height = size;
  const wrapper = document.getElementById('wheelWrapper');
  wrapper.style.width  = size + 'px';
  wrapper.style.height = size + 'px';
  const pad  = 14;
  const ring = document.getElementById('outerRing');
  ring.style.width  = (size + pad*2) + 'px';
  ring.style.height = (size + pad*2) + 'px';
  ring.style.top    = (-pad) + 'px';
  ring.style.left   = (-pad) + 'px';
}

function drawWheel() {
  const r  = getR();
  const cx = r, cy = r;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = '#fff0f5';
  ctx.fill();
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotAngle);
  ctx.translate(-cx, -cy);

  for (let i = 0; i < NUM; i++) {
    const startA = SLICE * i;
    const endA   = startA + SLICE;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r - 5, startA, endA);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth   = 2;
    ctx.stroke();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startA + SLICE / 2);
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle    = TEXT_COLORS[i % TEXT_COLORS.length];
    const fSize = Math.max(12, Math.floor(r * 0.10));
    ctx.font = `bold ${fSize}px 'Jua', sans-serif`;
    ctx.fillText(items[i], r * 0.78, 0);
    ctx.restore();
  }
  ctx.restore();
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.17, 0, Math.PI*2);
  ctx.fillStyle = '#fff0f5';
  ctx.fill();
  ctx.strokeStyle = '#f4a8c0';
  ctx.lineWidth   = 2.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, r - 2, 0, Math.PI*2);
  ctx.strokeStyle = '#f4a8c0';
  ctx.lineWidth   = 4;
  ctx.stroke();
}

const spinBtn = document.getElementById('spinBtn');

function spin() {
  if (spinning) return;
  spinning = true;
  spinBtn.disabled = true;
  document.getElementById('result-hint').textContent = '두구두구두구...';

  const totalRot   = Math.PI * 2 * (5 + Math.random() * 6);
  const duration   = 4500;
  const startTime  = performance.now();
  const startAngle = rotAngle;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const t  = Math.min((now - startTime) / duration, 1);
    rotAngle = startAngle + totalRot * easeOut(t);
    drawWheel();
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      spinBtn.disabled = false;
      showResult();
    }
  }
  requestAnimationFrame(animate);
}

function showResult() {
  const ptrAngle = ((-rotAngle - Math.PI / 2) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  const idx      = Math.floor(ptrAngle / SLICE) % NUM;
  
  // 중앙 팝업 데이터 입력 및 노출
  document.getElementById('targetNum').textContent = items[idx];
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('result-hint').textContent = '축하합니다!';
  
  launchFireworks();
}

function closeResult() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('result-hint').textContent = '🎀 한 번 더 돌려볼까요? 🎀';
}

/* ── 폭죽 애니메이션 ── */
const fwCanvas = document.getElementById('fireworks');
const fwCtx    = fwCanvas.getContext('2d');
let   particles = [];
let   fwRaf     = null;

function resizeFW() {
  fwCanvas.width  = window.innerWidth;
  fwCanvas.height = window.innerHeight;
}
resizeFW();

const FW_COLORS = ['#ffb8c8','#ffd6a5','#caffbf','#9bf6ff','#ffc6ff','#fff176','#f4a8c0'];

function launchFireworks() {
  for (let b = 0; b < 10; b++) {
    setTimeout(() => {
      const x = fwCanvas.width * (0.2 + Math.random() * 0.6);
      const y = fwCanvas.height * (0.2 + Math.random() * 0.4);
      const col = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
      for (let i = 0; i < 50; i++) {
        const a = (Math.PI*2 / 50) * i + Math.random() * 0.2;
        const sp = Math.random() * 6 + 2;
        particles.push({
          x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
          alpha: 1, color: col, r: Math.random()*3 + 2,
          shape: Math.random() < 0.3 ? 'star' : 'circle'
        });
      }
    }, b * 200);
  }
  if (!fwRaf) animFW();
}

function animFW() {
  fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
  particles = particles.filter(p => p.alpha > 0.02);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.alpha -= 0.015;
    fwCtx.save();
    fwCtx.globalAlpha = p.alpha;
    fwCtx.fillStyle = p.color;
    if (p.shape === 'star') {
      fwCtx.beginPath();
      for(let i=0; i<5; i++){
        const a = (Math.PI*2/5)*i - Math.PI/2;
        fwCtx.lineTo(p.x + Math.cos(a)*p.r*2, p.y + Math.sin(a)*p.r*2);
        fwCtx.lineTo(p.x + Math.cos(a+Math.PI/5)*p.r, p.y + Math.sin(a+Math.PI/5)*p.r);
      }
      fwCtx.fill();
    } else {
      fwCtx.beginPath();
      fwCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      fwCtx.fill();
    }
    fwCtx.restore();
  }
  if (particles.length > 0) fwRaf = requestAnimationFrame(animFW);
  else fwRaf = null;
}

setupCanvas();
drawWheel();
spinBtn.addEventListener('click', spin);
window.addEventListener('resize', () => { setupCanvas(); drawWheel(); resizeFW(); });
</script>
</body>
</html>
